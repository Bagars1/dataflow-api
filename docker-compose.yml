services:
  db:
    image: postgres:16
    container_name: dataflow_postgres
    environment:
      POSTGRES_DB: dataflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: dataflow_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/dataflow
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data: